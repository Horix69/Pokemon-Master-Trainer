<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3efe4"><title>Pokémon Master Trainer · Mesa de Kanto</title><link rel="stylesheet" href="ui/style.css"><link rel="stylesheet" href="ui/tabletop.css"><link rel="stylesheet" href="ui/expedition.css"></head>
<body><section class="welcome expeditionHome" aria-label="Menu principal"><div class="homeContent"><img class="pokemonLogo" src="assets/wordmark.webp" alt="Pokémon"><h1>Master<br><em>Trainer</em></h1><div class="homeModes"><button id="singleplayer"><b>Singleplayer</b><small>Jogar contra a IA</small><span aria-hidden="true">→</span></button><button id="multiplayer"><b>Multiplayer</b><small>Jogar no mesmo aparelho</small><span aria-hidden="true">→</span></button></div><button id="menuSettings" class="homeSettings">⚙ Configurações</button></div></section><div id="gameShell" hidden><header><div class="brand"><span class="ball" aria-hidden="true"></span><span>Master Trainer</span></div><nav><button id="tableNav" class="active">Mesa de jogo</button><button id="catalogNav">Coleção</button><button id="rulesNav">Regras</button></nav><button class="settings" id="settings" title="Configurações" aria-label="Configurações">⚙</button></header><div class="musicbar" role="group" aria-label="Música de fundo"><span>♫ &nbsp; Música de fundo</span><button type="button" id="musicToggle">▶ Tocar música</button><button id="volDown" aria-label="Diminuir volume">−</button><output id="volume">30%</output><button id="volUp" aria-label="Aumentar volume">+</button><button id="backMenu">Voltar ao menu</button><label class="rhythm">Ritmo da IA <select id="rhythm"><option value="guided">Guiado</option><option value="fast">Rápido</option></select></label><span id="musicStatus" role="status"></span><audio id="music" src="assets/trilha.mp3" preload="none" loop></audio></div>
